<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Property | DreamVoyage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #f7fbff 0%, #eef6ff 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .card-shell {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 22px 55px rgba(15,23,42,.08);
            border: 1px solid rgba(37,99,235,.08);
            max-width: 900px;
            margin: auto;
        }
        .form-control, textarea {
            border-radius: 14px;
            padding: 12px;
        }
        .btn-primary {
            border-radius: 999px;
            padding: 12px 24px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card-shell">
        <h2 class="fw-bold mb-4">Edit Property</h2>
        <p class="text-muted">Refine your listing details while keeping the existing property flow intact.</p>

        <form id="editPropertyForm">

            <input id="property_name" class="form-control mb-3" placeholder="Property Name">

            <input id="city" class="form-control mb-3" placeholder="City">

            <input id="area" class="form-control mb-3" placeholder="Area">

            <input id="price" type="number" class="form-control mb-3" placeholder="Price">

            <input id="bedrooms" type="number" class="form-control mb-3" placeholder="Bedrooms">

            <input id="bathrooms" type="number" class="form-control mb-3" placeholder="Bathrooms">

            <input id="sqft" type="number" class="form-control mb-3" placeholder="Square Feet">

            <input id="image" class="form-control mb-3" placeholder="Image URL">

            <textarea id="description" class="form-control mb-3" placeholder="Description"></textarea>

            <button class="btn btn-primary">
                Update Property
            </button>

        </form>
    </div>
</div>

<script src="../js/edit-property.js"></script>

</body>
</html>
